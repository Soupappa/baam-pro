<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <filter id="snap">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="1" seed="2" result="n">
        <animate attributeName="baseFrequency" dur="1.2s" repeatCount="indefinite"
          values="0.004;0.02;0.006;0.004" keyTimes="0;0.35;0.6;1"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0">
        <animate attributeName="scale" dur="1.2s" repeatCount="indefinite"
          values="0;60;10;0" keyTimes="0;0.35;0.6;1"/>
      </feDisplacementMap>
    </filter>
  </defs>

  <g filter="url(#snap)">
    <g stroke="#000" stroke-width="1">
      <line x1="0" y1="20" x2="800" y2="20"/>
      <line x1="0" y1="40" x2="800" y2="40"/>
      <line x1="0" y1="60" x2="800" y2="60"/>
      <line x1="0" y1="80" x2="800" y2="80"/>
      <line x1="0" y1="100" x2="800" y2="100"/>
      <line x1="0" y1="120" x2="800" y2="120"/>
      <line x1="0" y1="140" x2="800" y2="140"/>
      <line x1="0" y1="160" x2="800" y2="160"/>
      <line x1="0" y1="180" x2="800" y2="180"/>
      <line x1="0" y1="200" x2="800" y2="200"/>
      <line x1="0" y1="220" x2="800" y2="220"/>
      <line x1="0" y1="240" x2="800" y2="240"/>
      <line x1="0" y1="260" x2="800" y2="260"/>
      <line x1="0" y1="280" x2="800" y2="280"/>
      <line x1="0" y1="300" x2="800" y2="300"/>
      <line x1="0" y1="320" x2="800" y2="320"/>
      <line x1="0" y1="340" x2="800" y2="340"/>
      <line x1="0" y1="360" x2="800" y2="360"/>
      <line x1="0" y1="380" x2="800" y2="380"/>
    </g>
    <animateTransform attributeName="transform" type="scale"
      dur="1.2s" repeatCount="indefinite"
      values="1 1;0.9 1.1;1 1" keyTimes="0;0.35;1"/>
  </g>
</svg>
